[package]
name = "fastsearch-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "fastsearch MCP server: exposes hybrid search as Model Context Protocol tools over stdio (server-side non-bypassable ACL)."

[[bin]]
name = "fastsearch-mcp"
path = "src/main.rs"

[lib]
name = "fastsearch_mcp"
path = "src/lib.rs"

[dependencies]
fastsearch-core.workspace = true
fastsearch-engine.workspace = true
fastsearch-text.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# 远端档（KB-0.2）：MCP 作为 server 的纯 REST 客户端。与 CLI 同款瘦客户端（ureq + 显式超时）。
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
