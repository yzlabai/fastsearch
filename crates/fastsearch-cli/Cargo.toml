[package]
name = "fastsearch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "fastsearch command-line interface: ingest docparse chunks and search."

[[bin]]
name = "fastsearch"
path = "src/main.rs"

[lib]
name = "fastsearch_cli"
path = "src/lib.rs"

[dependencies]
# CLI 是 server 的**纯 REST 客户端**（四张脸之一）：检索/嵌入/落盘全归 server。
# 仅依赖 core（纯类型，做请求体/响应解析）+ eval（纯指标）+ ureq（HTTP）——不嵌引擎。
fastsearch-core.workspace = true
fastsearch-ingest-adapter.workspace = true
fastsearch-eval = { path = "../fastsearch-eval" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
ureq.workspace = true
# 解析实现已下沉 fastsearch-ingest-adapter；CLI feature 只转发 adapter feature。
# 默认 CLI 只依赖 adapter 的轻量 profile 类型，dependency tree 仍无任何 docparse crate。

[features]
# 开启 docparse 多格式解析（core + 轻量格式解析器 + 图片，**无 ONNX/渲染**）；默认不开，保持 CLI 精简。
parse = [
    "fastsearch-ingest-adapter/parse",
]
# OCR 增强（扫描件/图片无文本层 → PP-OCR 抽文本）：拉入 docparse-ocr（**重 ONNX/tract**）。
# 运行时需指 ONNX 模型目录（env `FASTSEARCH_OCR_MODELS`，如 docparse-rs/models/ppocr-v5）。
parse-ocr = ["parse", "fastsearch-ingest-adapter/parse-ocr"]
# 表格结构识别（**非 VLM**，确定性 ONNX）：检测出的表格区域经 UniRec 重识别为结构化 HTML 表格。
# 拉入 docparse-ocr（UniRec）+ docparse-raster（PDF 栅格化裁剪）。运行时需 env `FASTSEARCH_UNIREC_MODELS`
# （如 docparse-rs/models/unirec）。VLM 表格识别是另一条路（gated 于 VLM 服务），此为本地 ONNX 路。
parse-tables = ["parse", "fastsearch-ingest-adapter/parse-tables"]
# VLM 区域识别（**需外部 OpenAI 兼容服务**，如 vLLM 起 OvisOCR2）：表格区域 → HTML 重识别；
# 另设版面模型时 → 整页区域级转写。与 parse-tables 同为重档（编排在 docparse-ocr，含 tract）。
# 运行时 env：`FASTSEARCH_VLM_URL` + `FASTSEARCH_VLM_MODEL`（必需）、`FASTSEARCH_VLM_KEY`、
# `FASTSEARCH_LAYOUT_MODEL`（设了才开转写）、`FASTSEARCH_VLM_MAX_PAGES`（默认 50）。
parse-vlm = ["parse", "fastsearch-ingest-adapter/parse-vlm"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
